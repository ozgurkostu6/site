<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jarvis Ahmet</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff99;
    font-family:monospace;
    padding:20px;
}

h1{
    text-align:center;
    text-shadow:0 0 10px #00ff99;
}

#log{
    margin-top:20px;
    border:1px solid #00ff99;
    padding:10px;
    height:300px;
    overflow:auto;
}
</style>
</head>

<body>

<h1>🟢 JARVIS AHMET AKTİF</h1>

<div id="log"></div>

<script>

function log(t){
    document.getElementById("log").innerHTML += "<div>"+t+"</div>";
}

// 🔊 SES FONKSİYONU (FIXLİ)
function speak(text){

    window.speechSynthesis.cancel();

    let u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR";
    u.rate = 1;

    let voices = speechSynthesis.getVoices();
    if(voices.length > 0){
        u.voice = voices.find(v => v.lang.includes("tr")) || voices[0];
    }

    speechSynthesis.speak(u);

    log("Ahmet: " + text);
}

// 🧠 BEYİN
function brain(text){

    text = text.toLowerCase();

    if(text.includes("merhaba"))
        return "Merhaba Özgür, ben Ahmet";

    if(text.includes("nasılsın"))
        return "İyiyim Özgür";

    if(text.includes("ben kimim"))
        return "Sen Özgür, sistem sahibisin";

    if(text.includes("saat"))
        return "Saat " + new Date().toLocaleTimeString();

    if(text.includes("tarih"))
        return "Bugün " + new Date().toLocaleDateString("tr-TR");

    if(text.includes("youtube")){
        window.open("https://youtube.com");
        return "YouTube açılıyor";
    }

    if(text.includes("google")){
        window.open("https://google.com");
        return "Google açılıyor";
    }

    if(text.includes("şaka"))
        return "Robotlar gülmez ama ben deniyorum";

    return "Bunu anlayamadım Özgür";
}

// 🎤 SES SİSTEMİ
function start(){

    let SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRec){
        log("❌ Chrome Speech desteklemiyor");
        return;
    }

    let r = new SpeechRec();
    r.lang = "tr-TR";
    r.continuous = false;
    r.interimResults = false;

    speak("Sistem aktif Özgür. Ben Ahmet");

    r.onresult = function(e){

        let text = e.results[0][0].transcript;

        log("Sen: " + text);

        let res = brain(text);

        speak(res);
    };

    r.onerror = function(e){
        log("Hata: " + e.error);
    };

    r.onend = function(){
        setTimeout(() => {
            try { r.start(); } catch(e){}
        }, 500);
    };

    try{
        r.start();
    }catch(e){
        log("Başlatma hatası");
    }
}

// 🚀 BAŞLAT
window.onload = function(){

    // voice load fix
    speechSynthesis.onvoiceschanged = () => {
        speechSynthesis.getVoices();
    };

    start();
};

</script>

</body>
</html>
