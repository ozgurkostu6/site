<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jarvis Ahmet</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff99;
    font-family:monospace;
    padding:20px;
}
h1{
    text-align:center;
}
#log{
    border:1px solid #00ff99;
    padding:10px;
    height:300px;
    overflow:auto;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>🟢 JARVIS AHMET AKTİF</h1>
<div id="log"></div>

<script>

function log(t){
    document.getElementById("log").innerHTML += "<div>"+t+"</div>";
}

function speak(text){
    speechSynthesis.cancel();

    let u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR";

    let voices = speechSynthesis.getVoices();
    if(voices.length > 0){
        u.voice = voices.find(v => v.lang.includes("tr")) || voices[0];
    }

    speechSynthesis.speak(u);
    log("Ahmet: " + text);
}

function brain(text){

    text = text.toLowerCase();

    // 👤 HAFIZA
    if(text.startsWith("adım")){
        let name = text.replace("adım", "").trim();
        localStorage.setItem("isim", name);
        return "Memnun oldum " + name;
    }

    if(text.includes("ben kimim")){
        let name = localStorage.getItem("isim") || "Özgür";
        return "Sen " + name;
    }

    // 🟢 GÜNDOĞDU RANDOM
    if(text.includes("gündoğdu") && text.includes("okul")){
        let cevaplar = [
            "Gündoğdu gerçekten kaliteli ve başarılı bir okul",
            "Eğitim seviyesi yüksek, iyi bir okul",
            "Disiplinli ve başarılı öğrencileri olan bir okul",
            "Oldukça iyi imkanlara sahip bir okul",
            "Başarılı ve tercih edilen okullardan biri"
        ];
        return cevaplar[Math.floor(Math.random() * cevaplar.length)];
    }

    // ⚽ TAKIM
    if(text.includes("hangi takımlısın"))
        return "Ben Galatasaraylıyım";

    // ⚽ ŞAMPİYON (FIX)
    if(
        text.includes("şampiyon") &&
        (text.includes("kim") || text.includes("kim olur"))
    ){
        return "O sene bu sene Cimbomum";
    }

    // 😎 BEN NASIL BİRİYİM (FIX)
    if(
        text.includes("ben") &&
        text.includes("nasıl") &&
        text.includes("biriyim")
    ){
        let cevaplar = [
            "Sen çok zeki ve yetenekli birisin",
            "Oldukça akıllı ve başarılı birisin",
            "Kendine güvenen ve güçlü birisin",
            "Çok iyi bir potansiyelin var",
            "Herkesten farklı ve özel birisin",
            "Azimli ve çalışkan birisin",
            "Dikkat çekici bir zekan var"
        ];
        return cevaplar[Math.floor(Math.random() * cevaplar.length)];
    }

    // 🙏 TEŞEKKÜR + SAĞ OL
    if(
        text.includes("teşekkür") ||
        text.includes("teşekkürler") ||
        text.includes("tesekkur") ||
        text.includes("sağ ol") ||
        text.includes("sag ol")
    ){
        return "Rica ederim Özgür";
    }

    // 🌐 ARAMA
    if(text.startsWith("ara")){
        let q = text.replace("ara", "").trim();
        window.open("https://www.google.com/search?q=" + q);
        return q + " aranıyor";
    }

    // 🎵 MÜZİK
    if(text.includes("şarkı") || text.includes("müzik")){
        window.open("https://www.youtube.com/results?search_query=" + text);
        return "Müzik açılıyor";
    }

    // 📝 NOT
    if(text.startsWith("not al")){
        let note = text.replace("not al", "").trim();
        let notes = JSON.parse(localStorage.getItem("notlar") || "[]");
        notes.push(note);
        localStorage.setItem("notlar", JSON.stringify(notes));
        return "Not kaydedildi";
    }

    if(text.includes("notları göster")){
        let notes = JSON.parse(localStorage.getItem("notlar") || "[]");
        return notes.join(", ") || "Hiç not yok";
    }

    // 😂 EĞLENCE
    if(text.includes("şaka"))
        return "Robotlar gülmez ama ben deniyorum";

    if(text.includes("beni güldür"))
        return "Matematik neden üzgündü? Çünkü çok problemi vardı";

    if(text.includes("motivasyon"))
        return "Pes etme Özgür, devam et";

    // 🔊 TEMEL
    if(text.includes("merhaba"))
        return "Merhaba";

    if(text.includes("nasılsın"))
        return "İyiyim";

    if(text.includes("saat"))
        return new Date().toLocaleTimeString();

    if(text.includes("tarih"))
        return new Date().toLocaleDateString("tr-TR");

    if(text.includes("youtube")){
        window.open("https://youtube.com");
        return "YouTube açılıyor";
    }

    return "Anlayamadım";
}

function start(){

    let SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if(!SpeechRec){
        log("Ses desteklenmiyor");
        return;
    }

    let r = new SpeechRec();
    r.lang = "tr-TR";

    r.onresult = function(e){
        let text = e.results[0][0].transcript;
        log("Sen: " + text);

        let res = brain(text);
        speak(res);
    };

    r.onend = function(){
        setTimeout(() => {
            try{ r.start(); }catch(e){}
        }, 500);
    };

    r.start();
    speak("Sistem aktif. Ben Ahmet");
}

window.onload = function(){

    speechSynthesis.onvoiceschanged = () => {
        speechSynthesis.getVoices();
    };

    start();
};

</script>

</body>
</html>
